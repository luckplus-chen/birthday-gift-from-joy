name: Build and publish birthday page
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the single-file website
        working-directory: site
        run: |
          node build-content.js
          node build-site.js
      - name: Prepare Pages files
        run: |
          mkdir -p _site
          cp 生日快乐.html _site/index.html
      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website files
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - name: Publish to GitHub Pages
        uses: actions/deploy-pages@v4
